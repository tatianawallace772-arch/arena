name: Build Dubuntu ISO

# Builds the live ISO on GitHub's Ubuntu 24.04 runner and uploads it as a
# workflow artifact. Manual only: an ISO is ~5 GB and takes 30-60 minutes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dubuntu version string"
        default: "24.04"
        required: true
      distribution:
        description: "Ubuntu suite to bootstrap"
        default: "noble"
        required: true

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install live-build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso isolinux \
            grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed \
            shim-signed ubuntu-keyring mtools dosfstools rsync

      - name: Build ISO
        env:
          DUBUNTU_VERSION: ${{ inputs.version }}
          DUBUNTU_DISTRIBUTION: ${{ inputs.distribution }}
        run: sudo -E ./scripts/build.sh

      - name: Show output
        run: |
          ls -lh build/out
          cat build/out/SHA256SUMS

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: dubuntu-${{ inputs.version }}-amd64
          path: |
            build/out/*.iso
            build/out/SHA256SUMS
            build/out/*.sha256
          compression-level: 0
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          retention-days: 7
