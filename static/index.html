<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotAPIfy — Web Player</title>
<link rel="icon" href="/api/covers/spotapify.svg?kind=album" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12.5 3.2a1 1 0 0 0-1 0L4 9.2V20a1 1 0 0 0 1 1h4.5v-6h5v6H19a1 1 0 0 0 1-1V9.2l-7.5-6z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.6 13.4l4.3 4.3 1.4-1.4-4.3-4.3A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M3 3h2v18H3V3zm5 0h2v18H8V3zm11 0h2v18h-2V3zm-6 0h2v18h-2V3z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.1v13.8c0 .8.9 1.3 1.6.9l10.6-6.9a1 1 0 0 0 0-1.7L9.6 4.2A1 1 0 0 0 8 5.1z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5.9v12.2a1 1 0 0 0 1.6.8L16 13.6V18a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1v4.4L6.6 5A1 1 0 0 0 5 5.9z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5.9v12.2a1 1 0 0 1-1.6.8L8 13.6V18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v4.4L17.4 5A1 1 0 0 1 19 5.9z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M17.7 3l3 3-3 3V7h-2.3l-7 10H3v-2h4.3l7-10H17.7V3zM3 7h5.4l1.9 2.7-1.5 2.1L6.6 9H3V7zm12.4 10l1.9 0v-2l3 3-3 3v-2h-1.3l-3.4-4.9 1.5-2.1 2.3 3.3v1.7z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-9.8-9.2C.6 8.6 2.4 5 5.8 5c2 0 3.4 1.1 4.2 2.3l2 2.7 2-2.7C14.8 6.1 16.2 5 18.2 5c3.4 0 5.2 3.6 3.6 6.8C19.5 16.1 12 21 12 21zm0-2.4c1.8-1.2 6-4.8 7.8-8.1.9-1.6.1-3.5-1.6-3.5-1.2 0-2 .8-2.6 1.7L12 13.2 8.4 8.7C7.8 7.8 7 7 5.8 7 4.1 7 3.3 8.9 4.2 10.5c1.8 3.3 6 6.9 7.8 8.1z"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-9.8-9.2C.6 8.6 2.4 5 5.8 5c2 0 3.4 1.1 4.2 2.3l2 2.7 2-2.7C14.8 6.1 16.2 5 18.2 5c3.4 0 5.2 3.6 3.6 6.8C19.5 16.1 12 21 12 21z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a3.5 3.5 0 0 0-2-3.2v6.4a3.5 3.5 0 0 0 2-3.2zm-2-7.6v2.1a5.5 5.5 0 0 1 0 11v2.1a7.5 7.5 0 0 0 0-15.2z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 5h-2v6l5 3 1-1.7-4-2.3V8z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6h-2V7.4l-7.3 7.3-1.4-1.4L16.6 6H14V4zM6 6h5v2H8v8h8v-3h2v5H6V6z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z"/></symbol>
  </defs>
</svg>

<div id="app">
  <aside id="sidebar">
    <div class="logo" onclick="location.hash='#/'">
      <svg class="logo-mark" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.5a.7.7 0 0 1-1 .24c-2.7-1.65-6.1-2-10.1-1.1a.75.75 0 1 1-.33-1.46c4.4-1 8.2-.57 11.2 1.3.34.21.44.68.24 1.02zm1.4-3.1a.9.9 0 0 1-1.24.3c-3.1-1.9-7.8-2.45-11.45-1.34a.9.9 0 1 1-.52-1.72c4.2-1.28 9.4-.66 13 1.55.43.26.56.82.3 1.24zm.12-3.2C14.4 8 9.3 7.8 5.7 8.8a1.05 1.05 0 0 1-.6-2.02c4-1.1 9.6-.9 13.4 1.56a1.05 1.05 0 0 1-1.08 1.8z"/></svg>
      <span>SpotAPIfy</span>
    </div>
    <nav class="nav">
      <a href="#/" class="nav-link" data-nav="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
      <a href="#/search" class="nav-link" data-nav="search"><svg><use href="#i-search"/></svg><span>Search</span></a>
      <a href="#/liked" class="nav-link" data-nav="liked"><svg><use href="#i-heart-fill"/></svg><span>Liked Songs</span></a>
    </nav>
    <div class="sidebar-section">
      <div class="sidebar-title"><svg><use href="#i-library"/></svg><span>Playlists</span></div>
      <div id="sidebar-playlists" class="sidebar-playlists"></div>
    </div>
    <div class="sidebar-footer">
      <span id="mode-badge" class="mode-badge" title="Data source">…</span>
    </div>
  </aside>

  <main id="view" tabindex="-1"></main>
</div>

<footer id="player">
  <div class="player-left">
    <img id="p-cover" class="p-cover hidden" alt="">
    <div class="p-meta">
      <div id="p-title" class="p-title"></div>
      <div id="p-artist" class="p-artist"></div>
    </div>
    <button id="p-like" class="icon-btn hidden" title="Save to Liked Songs"><svg><use href="#i-heart"/></svg></button>
  </div>
  <div class="player-center">
    <div class="p-controls">
      <button id="p-shuffle" class="icon-btn" title="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
      <button id="p-prev" class="icon-btn" title="Previous"><svg><use href="#i-prev"/></svg></button>
      <button id="p-play" class="play-btn" title="Play"><svg><use href="#i-play"/></svg></button>
      <button id="p-next" class="icon-btn" title="Next"><svg><use href="#i-next"/></svg></button>
      <button id="p-repeat" class="icon-btn" title="Repeat"><svg><use href="#i-repeat"/></svg></button>
    </div>
    <div class="p-progress">
      <span id="p-elapsed" class="p-time">0:00</span>
      <input id="p-seek" type="range" min="0" max="1000" value="0" step="1">
      <span id="p-duration" class="p-time">0:00</span>
    </div>
  </div>
  <div class="player-right">
    <button id="p-queue-btn" class="icon-btn" title="Queue"><svg><use href="#i-queue"/></svg></button>
    <svg class="vol-icon"><use href="#i-volume"/></svg>
    <input id="p-volume" type="range" min="0" max="100" value="80" step="1">
  </div>
</footer>

<div id="queue-panel" class="hidden">
  <div class="queue-head">
    <h3>Queue</h3>
    <button id="queue-close" class="icon-btn">✕</button>
  </div>
  <div id="queue-list"></div>
</div>

<div id="toast-wrap"></div>
<audio id="audio" preload="auto"></audio>
<script src="/static/app.js"></script>
</body>
</html>
